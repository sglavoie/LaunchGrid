name: CI

# Changes only to the website or the documentation skip it (website.yml checks the website).
on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["website/**", "docs/**", "**.md"]

permissions:
  contents: read

# A newer push to a pull request cancels its run still in progress; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The Liquid Glass background needs the macOS 26 SDK to compile.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bundle's build number is `git rev-list --count HEAD`.
          fetch-depth: 0
      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: .build
          # An exact hit only when nothing changed; otherwise the latest cache makes the build incremental.
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Test the Mac App Store variant
        # Its own build folder (inside the cache), so the flag doesn't rebuild everything twice.
        run: swift test --scratch-path .build/app-store -Xswiftc -DAPP_STORE
      - name: Bundle
        # Universal, as the downloadable release is.
        run: UNIVERSAL=1 scripts/bundle.sh release

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the shell scripts
        # Preinstalled on GitHub's Ubuntu runners.
        run: shellcheck scripts/*.sh
