name: CI

# Changes only to the website or the documentation skip the jobs (website.yml checks the
# website). Skipped, not left out: a skipped job still reports, so a required check doesn't
# wait forever on a pull request that only touches those.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its run still in progress; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Look for changes outside the website and the documentation
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a base to compare with (a new branch's first push), everything counts.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null &&
              ! git diff --name-only "$BASE" HEAD | grep -qvE '^(website|docs)/|\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The Liquid Glass background needs the macOS 26 SDK to compile.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bundle's build number is `git rev-list --count HEAD`.
          fetch-depth: 0
      - name: Select Xcode
        # Pinned, so an image update doesn't change the compiler unannounced; bump it on purpose.
        env:
          XCODE: /Applications/Xcode_26.6.app
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
          echo "XCODE_BUILD=$(xcodebuild -version | sed -n 's/^Build version //p')" >> "$GITHUB_ENV"
      - name: Restore build products
        uses: actions/cache/restore@v4
        with:
          path: .build
          # An exact hit only when nothing changed; otherwise the latest cache makes the build incremental.
          key: spm-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Test the Mac App Store variant
        # Its own build folder (inside the cache), so the flag doesn't rebuild everything twice.
        run: swift test --scratch-path .build/app-store -Xswiftc -DAPP_STORE
      - name: Bundle
        # Universal, as the downloadable release is.
        run: |
          UNIVERSAL=1 scripts/bundle.sh release
          plutil -lint build/LaunchGrid.app/Contents/Info.plist scripts/PrivacyInfo.xcprivacy scripts/LaunchGrid.entitlements
          codesign --verify --strict --verbose=2 build/LaunchGrid.app
      - name: Bundle the Mac App Store variant
        # Signed ad hoc with a stand-in profile: checks the variant's own Info.plist keys and
        # sandbox signing, which otherwise first run on the day of a submission.
        run: |
          touch "$RUNNER_TEMP/stand-in.provisionprofile"
          APP_STORE=1 SANDBOX=1 PROVISIONING_PROFILE="$RUNNER_TEMP/stand-in.provisionprofile" scripts/bundle.sh release
          plutil -lint build/LaunchGrid.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :DTXcode' build/LaunchGrid.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 build/LaunchGrid.app
          codesign -d --entitlements - build/LaunchGrid.app | grep -q com.apple.security.app-sandbox
          # The debug scripts are compiled out (-DAPP_STORE): their environment variables, read
          # only by DebugScript.swift and the code in AppDelegate.swift that starts it, are absent.
          if strings -a build/LaunchGrid.app/Contents/MacOS/LaunchGrid | grep -E 'LAUNCHGRID_DEBUG_(SCRIPT|DIR)'; then
            echo "::error::The Mac App Store binary contains debug-script code."
            exit 1
          fi
      - name: Save build products
        # Only from main: a cache saved by every pull request push would evict the useful ones.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}

  shellcheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the shell scripts
        # Preinstalled on GitHub's Ubuntu runners.
        run: shellcheck scripts/*.sh
