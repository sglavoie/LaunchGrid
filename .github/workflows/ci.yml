name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The Liquid Glass background needs the macOS 26 SDK to compile.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/bundle.sh release
