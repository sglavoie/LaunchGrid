name: Website

# Checks website/public, and that the README's animation (docs/readme) was made from its video,
# on pull requests that change them, and publishes it to
# launchgrid.sglavoie.com when a push to main changes it, as `just website-deploy` does.
# Deploying needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/readme/**", "scripts/check-website.sh", "scripts/readme-demo.sh", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "docs/readme/**", "scripts/check-website.sh", "scripts/readme-demo.sh", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check that every referenced file and #fragment exists
        run: scripts/check-website.sh
      - name: Check that the README's animation was made from the current video
        run: scripts/readme-demo.sh --check

  deploy:
    needs: check
    # Only main is published: a manual run started on another branch only checks it.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time; a newer push replaces a deploy still waiting to start.
    concurrency:
      group: website
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        working-directory: website
        run: npx -y wrangler@4.149.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
